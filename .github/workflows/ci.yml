name: CI / Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  # Manual pipeline test: builds all artifacts, never publishes (release job
  # is tag-gated).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Use bash on every runner (Git Bash on Windows) so build scripts are uniform.
defaults:
  run:
    shell: bash

jobs:
  # ─── Lint & Test (all three OSes) ─────────────────────────────────────────
  test:
    name: Lint & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history needed for git rev-list (.build-number)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # ─── Build installers per OS ──────────────────────────────────────────────
  # node-pty / serialport native modules cannot be cross-compiled, so every
  # OS/arch pair builds on its own native runner (windows-11-arm and
  # ubuntu-24.04-arm are free for public repos). Explicit --x64/--arm64 flags
  # override the multi-arch lists in package.json so each runner builds only
  # its own architecture.
  build:
    name: Build (${{ matrix.name }})
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos
            flags: --mac
          # Windows (both arches): npmRebuild=false + --ignore-scripts install.
          # node-pty/serialport ship N-API win32 prebuilds (ABI-stable in
          # Electron); letting npm/electron-builder compile them instead trips
          # Node 22's .cmd-spawn block (EINVAL in node-gyp-build) and, on
          # arm64, missing Spectre-mitigated libs.
          - os: windows-latest
            name: windows-x64
            flags: --win --x64 -c.npmRebuild=false
          - os: windows-11-arm
            name: windows-arm64
            flags: --win --arm64 -c.npmRebuild=false
          - os: ubuntu-latest
            name: linux-x64
            flags: --linux --x64
          # linux-arm64: npmRebuild=false — electron-builder's `npm rebuild`
          # re-runs node-pty's raw install script, which mis-targets x64
          # (-m64) on this runner and its failure poisons the temp files the
          # deb/fpm stage needs. npm ci already compiled node-pty correctly
          # (N-API — Electron-safe); serialport uses its linux-arm64 prebuild.
          - os: ubuntu-24.04-arm
            name: linux-arm64
            flags: --linux --arm64 -c.npmRebuild=false
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Linux packaging deps (deb)
        if: startsWith(matrix.name, 'linux')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg

      - name: Install system fpm (arm64 — electron-builder's bundled fpm is x86-only)
        if: matrix.name == 'linux-arm64'
        run: sudo apt-get install -y --no-install-recommends ruby ruby-dev && sudo gem install --no-document fpm

      - name: Install dependencies
        if: ${{ !startsWith(matrix.name, 'windows-') }}
        run: npm ci

      - name: Install dependencies (Windows — prebuilds only)
        if: startsWith(matrix.name, 'windows-')
        # --ignore-scripts skips the compile-happy install scripts (see the
        # npmRebuild=false note in the matrix); the shipped win32 N-API
        # prebuilds are used instead. Exception: serialport has no win32-arm64
        # prebuild, so that one module is rebuilt natively on the arm runner.
        run: |
          npm ci --ignore-scripts
          if [ "${{ matrix.name }}" = "windows-arm64" ]; then
            npx electron-rebuild -f --only @serialport/bindings-cpp
          fi

      - name: Build distribution
        # Per-matrix --win/--linux/--mac + arch flags target this runner only.
        # --publish never — the release job handles GitHub Releases.
        # Retry up to 3× — hdiutil (mac DMG) / appimage steps can flake on CI.
        run: |
          npm run prebuild
          for attempt in 1 2 3; do
            echo "Build attempt $attempt..."
            if npx electron-builder ${{ matrix.flags }} --publish never; then
              echo "Build succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 3 ]; then echo "Build failed after 3 attempts"; exit 1; fi
            echo "Build failed, retrying in 10s..."
            sleep 10
          done
        env:
          # macOS: ad-hoc signing is done in build/afterPack.js — stop
          # electron-builder from hunting for a Developer ID cert.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # linux-arm64: use the system fpm installed above.
          USE_SYSTEM_FPM: ${{ matrix.name == 'linux-arm64' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prateek-term-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          retention-days: 30
          if-no-files-found: ignore

  # ─── GitHub Release (all platforms' artifacts) ────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into dist/
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.yml' \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then RANGE="${PREV_TAG}..HEAD"; else RANGE="HEAD"; fi

          get_commits() {
            local prefix="$1"
            git log $RANGE --pretty=format:"%s" --no-merges \
              | grep -E "^${prefix}(\(.+\))?:" \
              | sed "s/^${prefix}(\(.*\)): /\`\1\` — /" \
              | sed "s/^${prefix}: //" \
              | sed 's/^/- /' \
              || true
          }
          FEATS=$(get_commits "feat")
          FIXES=$(get_commits "fix")
          PERFS=$(get_commits "perf")
          REFACTORS=$(get_commits "refactor")
          DOCS=$(get_commits "docs")
          CHORES=$(get_commits "chore|ci|test")

          BODY="## Prateek-Term ${VERSION}

          Cross-platform — macOS, Windows, and Linux.

          ### Download
          | Platform | File |
          |----------|------|
          | macOS (Apple Silicon) | \`Prateek-Term-${VERSION}-arm64.dmg\` |
          | Windows x64 | \`Prateek-Term-Setup-${VERSION}-x64.exe\` (installer) / \`-portable.exe\` |
          | Windows ARM64 | \`Prateek-Term-Setup-${VERSION}-arm64.exe\` (installer) / \`-portable.exe\` |
          | Linux x64 / ARM64 | \`Prateek-Term-${VERSION}[-arm64].AppImage\` / \`.deb\` |

          > **macOS:** ad-hoc signed — right-click the app -> Open -> Open anyway if Gatekeeper warns.
          > **Windows:** unsigned — click \"More info\" -> \"Run anyway\" on the SmartScreen prompt.
          "

          [ -n "$FEATS" ]     && BODY="${BODY}
          ### New Features
          ${FEATS}"
          [ -n "$FIXES" ]     && BODY="${BODY}
          ### Bug Fixes
          ${FIXES}"
          [ -n "$PERFS" ]     && BODY="${BODY}
          ### Performance
          ${PERFS}"
          [ -n "$REFACTORS" ] && BODY="${BODY}
          ### Improvements
          ${REFACTORS}"
          [ -n "$DOCS" ]      && BODY="${BODY}
          ### Documentation
          ${DOCS}"
          [ -n "$CHORES" ]    && BODY="${BODY}
          ### Maintenance
          ${CHORES}"

          echo "$BODY" > release-notes.md
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Prateek-Term ${{ needs.build.outputs.version }}"
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
