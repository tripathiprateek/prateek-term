name: CI / Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  # Manual pipeline test: builds all artifacts, never publishes (release job
  # is tag-gated).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Use bash on every runner (Git Bash on Windows) so build scripts are uniform.
defaults:
  run:
    shell: bash

jobs:
  # ─── Version guard ────────────────────────────────────────────────────────
  # A tag whose name disagrees with package.json produces a release whose title,
  # assets and in-app update check all disagree with each other. This job always
  # runs and self-exits for non-tag builds: putting an `if:` on the job itself
  # would make it "skipped", and a skipped `needs` dependency skips `build` too,
  # so nothing would ever build on main.
  guard:
    name: Version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json; pre-release tags must be well-formed
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *) echo "Not a tag build — nothing to check."; exit 0 ;;
          esac
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"; exit 1
          fi
          case "$TAG" in
            *-*)
              echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-(rc|beta)\.[0-9]+$' \
                || { echo "::error::pre-release tag must be X.Y.Z-rc.N or X.Y.Z-beta.N"; exit 1; } ;;
          esac
          echo "Version guard passed."

  # ─── Lint & Test (all three OSes) ─────────────────────────────────────────
  test:
    name: Lint & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history needed for git rev-list (.build-number)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # install.sh is curl|sh-ed straight from main, so a syntax slip there is
      # shipped to users instantly. One runner is enough.
      - name: Shellcheck install.sh
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck install.sh

      - name: Test
        run: npm test

  # ─── Build installers per OS ──────────────────────────────────────────────
  # node-pty / serialport native modules cannot be cross-compiled, so every
  # OS/arch pair builds on its own native runner (windows-11-arm and
  # ubuntu-24.04-arm are free for public repos). Explicit --x64/--arm64 flags
  # override the multi-arch lists in package.json so each runner builds only
  # its own architecture.
  build:
    name: Build (${{ matrix.name }})
    needs: [test, guard]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos
            flags: --mac
          # Windows (both arches): npmRebuild=false + --ignore-scripts install.
          # node-pty/serialport ship N-API win32 prebuilds (ABI-stable in
          # Electron); letting npm/electron-builder compile them instead trips
          # Node 22's .cmd-spawn block (EINVAL in node-gyp-build) and, on
          # arm64, missing Spectre-mitigated libs.
          - os: windows-latest
            name: windows-x64
            flags: --win --x64 -c.npmRebuild=false
          - os: windows-11-arm
            name: windows-arm64
            flags: --win --arm64 -c.npmRebuild=false
          - os: ubuntu-latest
            name: linux-x64
            flags: --linux --x64
          # linux-arm64: npmRebuild=false — electron-builder's `npm rebuild`
          # re-runs node-pty's raw install script, which mis-targets x64
          # (-m64) on this runner and its failure poisons the temp files the
          # deb/fpm stage needs. npm ci already compiled node-pty correctly
          # (N-API — Electron-safe); serialport uses its linux-arm64 prebuild.
          - os: ubuntu-24.04-arm
            name: linux-arm64
            flags: --linux --arm64 -c.npmRebuild=false
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Linux packaging deps (deb)
        if: startsWith(matrix.name, 'linux')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg

      - name: Install system fpm (arm64 — electron-builder's bundled fpm is x86-only)
        if: matrix.name == 'linux-arm64'
        run: sudo apt-get install -y --no-install-recommends ruby ruby-dev && sudo gem install --no-document fpm

      - name: Install dependencies
        if: ${{ !startsWith(matrix.name, 'windows-') }}
        run: npm ci

      - name: Install dependencies (Windows — prebuilds only)
        if: startsWith(matrix.name, 'windows-')
        # --ignore-scripts skips the compile-happy install scripts (see the
        # npmRebuild=false note in the matrix); the shipped win32 N-API
        # prebuilds are used instead. Exception: serialport has no win32-arm64
        # prebuild, so that one module is rebuilt natively on the arm runner.
        run: |
          npm ci --ignore-scripts
          if [ "${{ matrix.name }}" = "windows-arm64" ]; then
            npx electron-rebuild -f --only @serialport/bindings-cpp
          fi

      - name: Build distribution
        # Per-matrix --win/--linux/--mac + arch flags target this runner only.
        # --publish never — the release job handles GitHub Releases.
        # Retry up to 3× — hdiutil (mac DMG) / appimage steps can flake on CI.
        run: |
          npm run prebuild
          for attempt in 1 2 3; do
            echo "Build attempt $attempt..."
            if npx electron-builder ${{ matrix.flags }} --publish never; then
              echo "Build succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 3 ]; then echo "Build failed after 3 attempts"; exit 1; fi
            echo "Build failed, retrying in 10s..."
            sleep 10
          done
        env:
          # macOS: ad-hoc signing is done in build/afterPack.js — stop
          # electron-builder from hunting for a Developer ID cert.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # linux-arm64: use the system fpm installed above.
          USE_SYSTEM_FPM: ${{ matrix.name == 'linux-arm64' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prateek-term-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          retention-days: 30
          if-no-files-found: ignore

  # ─── GitHub Release (all platforms' artifacts) ────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into dist/
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.yml' \) -exec cp {} dist/ \;
          ls -la dist/

      # SHA256SUMS is what install.sh / install.ps1 verify against, and what the
      # cask + Scoop manifests take their hashes from. Bare filenames and the
      # two-space separator matter: install.sh does `grep " <file>$" | sha256sum -c -`.
      - name: Prune non-installer artifacts and generate SHA256SUMS
        working-directory: dist
        run: |
          rm -f ./*.blockmap latest*.yml builder-debug.yml SHA256SUMS
          sha256sum $(ls -1) > SHA256SUMS
          cat SHA256SUMS

      - name: Upload checksums for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then RANGE="${PREV_TAG}..HEAD"; else RANGE="HEAD"; fi

          get_commits() {
            local prefix="$1"
            git log $RANGE --pretty=format:"%s" --no-merges \
              | grep -E "^${prefix}(\(.+\))?:" \
              | sed "s/^${prefix}(\(.*\)): /\`\1\` — /" \
              | sed "s/^${prefix}: //" \
              | sed 's/^/- /' \
              || true
          }
          FEATS=$(get_commits "feat")
          FIXES=$(get_commits "fix")
          PERFS=$(get_commits "perf")
          REFACTORS=$(get_commits "refactor")
          DOCS=$(get_commits "docs")
          CHORES=$(get_commits "chore|ci|test")

          # Pre-release tags install from the @rc / -rc channel.
          case "$TAG" in
            *-rc.*|*-beta.*) CASK='prateek-term@rc'; SCOOP='prateek-term-rc'; CHAN=' -s -- --channel rc' ;;
            *)               CASK='prateek-term';    SCOOP='prateek-term';    CHAN='' ;;
          esac

          BODY="## Prateek-Term ${VERSION}

          Cross-platform — macOS, Windows, and Linux.

          ### Install

          **macOS** (Apple Silicon)
          \`\`\`sh
          brew tap tripathiprateek/prateek-term
          brew install --cask --no-quarantine ${CASK}
          \`\`\`

          **Linux** (x64 / ARM64)
          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/tripathiprateek/prateek-term/main/install.sh | sh${CHAN}
          \`\`\`

          **Windows** (x64 / ARM64)
          \`\`\`powershell
          scoop bucket add prateek-term https://github.com/tripathiprateek/scoop-prateek-term
          scoop install ${SCOOP}
          \`\`\`

          ### Or download directly
          | Platform | File |
          |----------|------|
          | macOS (Apple Silicon) | \`Prateek-Term-${VERSION}-arm64.dmg\` |
          | Windows x64 | \`Prateek-Term-Setup-${VERSION}-x64.exe\` (installer) / \`-portable.exe\` |
          | Windows ARM64 | \`Prateek-Term-Setup-${VERSION}-arm64.exe\` (installer) / \`-portable.exe\` |
          | Linux x64 / ARM64 | \`Prateek-Term-${VERSION}[-arm64].AppImage\` / \`.deb\` |

          Verify any download against \`SHA256SUMS\`, published with this release.

          > **macOS:** ad-hoc signed, not notarized — hence \`--no-quarantine\`. Downloading the .dmg directly instead? Right-click the app -> Open -> Open anyway.
          > **Windows:** unsigned. Scoop avoids SmartScreen by extracting a zip; the .exe installer will prompt — click \"More info\" -> \"Run anyway\".
          > **Linux:** the \`.deb\` is a manual \`dpkg -i\` install. Use the script above for managed upgrades.
          "

          [ -n "$FEATS" ]     && BODY="${BODY}
          ### New Features
          ${FEATS}"
          [ -n "$FIXES" ]     && BODY="${BODY}
          ### Bug Fixes
          ${FIXES}"
          [ -n "$PERFS" ]     && BODY="${BODY}
          ### Performance
          ${PERFS}"
          [ -n "$REFACTORS" ] && BODY="${BODY}
          ### Improvements
          ${REFACTORS}"
          [ -n "$DOCS" ]      && BODY="${BODY}
          ### Documentation
          ${DOCS}"
          [ -n "$CHORES" ]    && BODY="${BODY}
          ### Maintenance
          ${CHORES}"

          echo "$BODY" > release-notes.md
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Prateek-Term ${{ needs.build.outputs.version }}"
          body_path: release-notes.md
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS
            install.sh
            install.ps1
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

  # ─── Update Homebrew tap + Scoop bucket ───────────────────────────────────
  # Kept separate from `release` so a token expiry or a transient push failure
  # can be re-run on its own without re-publishing the GitHub release.
  # Needs PACKAGE_MANAGER_TOKEN: a fine-grained PAT with Contents:RW on both
  # tap repos. The workflow's own GITHUB_TOKEN is scoped to this repo only.
  publish-managers:
    name: Update Homebrew tap + Scoop bucket
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums

      - name: Resolve version, channel and hashes
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in *-*) PRE=true ;; *) PRE=false ;; esac
          sha() { grep -E "  $1\$" SHA256SUMS | cut -d' ' -f1; }
          {
            echo "version=$VERSION"
            echo "prerelease=$PRE"
            echo "mac=$(sha "Prateek-Term-${VERSION}-arm64.zip")"
            echo "win_x64=$(sha "Prateek-Term-${VERSION}-x64.zip")"
            echo "win_arm64=$(sha "Prateek-Term-${VERSION}-arm64.zip")"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_MANAGER_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PACKAGE_MANAGER_TOKEN not set — skipping tap update."; exit 0
          fi
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/tripathiprateek/homebrew-prateek-term.git" tap
          if [ "${{ steps.v.outputs.prerelease }}" = true ]; then CASK='prateek-term@rc'; else CASK='prateek-term'; fi
          f="tap/Casks/${CASK}.rb"
          [ -f "$f" ] || cp "packaging/homebrew/Casks/${CASK}.rb" "$f"
          sed -i -E "s|^( *version )\".*\"|\1\"${{ steps.v.outputs.version }}\"|" "$f"
          sed -i -E "s|^( *sha256 ).*|\1\"${{ steps.v.outputs.mac }}\"|"        "$f"
          cd tap
          git config user.name  'prateek-term-release'
          git config user.email 'actions@github.com'
          git add -A
          git diff --cached --quiet || git commit -m "${CASK} ${{ steps.v.outputs.version }}"
          git push

      - name: Update Scoop manifest
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_MANAGER_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PACKAGE_MANAGER_TOKEN not set — skipping bucket update."; exit 0
          fi
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/tripathiprateek/scoop-prateek-term.git" bucket
          if [ "${{ steps.v.outputs.prerelease }}" = true ]; then M='prateek-term-rc'; else M='prateek-term'; fi
          mkdir -p bucket/bucket
          [ -f "bucket/bucket/${M}.json" ] || cp "packaging/scoop/bucket/${M}.json" "bucket/bucket/${M}.json"
          node -e '
            const fs = require("fs");
            const [f, v, base, h64, harm] = process.argv.slice(1);
            const m = JSON.parse(fs.readFileSync(f, "utf8"));
            m.version = v;
            m.architecture["64bit"] = { url: `${base}/Prateek-Term-${v}-x64.zip`,   hash: h64  };
            m.architecture["arm64"] = { url: `${base}/Prateek-Term-${v}-arm64.zip`, hash: harm };
            fs.writeFileSync(f, JSON.stringify(m, null, 4) + "\n");
          ' "bucket/bucket/${M}.json" \
            "${{ steps.v.outputs.version }}" \
            "https://github.com/tripathiprateek/prateek-term/releases/download/${GITHUB_REF_NAME}" \
            "${{ steps.v.outputs.win_x64 }}" "${{ steps.v.outputs.win_arm64 }}"
          cd bucket
          git config user.name  'prateek-term-release'
          git config user.email 'actions@github.com'
          git add -A
          git diff --cached --quiet || git commit -m "${M} ${{ steps.v.outputs.version }}"
          git push
